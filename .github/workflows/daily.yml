name: Tests

# Q4: the GitHub job no longer runs the pipeline; it runs the tests whenever code is pushed.
# The pipeline itself runs on Younes's PC (Windows scheduled task, P8), so this job needs
# no secrets, no data/ folder and no network beyond installing packages.
on:
  push:
  workflow_dispatch:   # allows a manual run from the GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Same Python version as the local venv that runs the pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
