name: Daily Job Pipeline

on:
  schedule:
    # Runs every weekday at 08:00 Amsterdam time (07:00 UTC)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the seen-jobs cache so we don't re-surface old listings
      - name: Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      # Restore the IND register so we don't re-download every day
      - name: Restore IND register cache
        uses: actions/cache@v4
        with:
          path: data/ind_sponsors.csv
          key: ind-register-${{ github.run_id }}
          restore-keys: ind-register-

      - name: Run pipeline
        run: python main.py

      # Upload the CSV as a downloadable artifact in the Actions UI
      - name: Upload jobs CSV
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ github.run_id }}
          path: data/jobs.csv
          retention-days: 30
